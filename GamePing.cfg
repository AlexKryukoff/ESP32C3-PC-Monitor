;=============================================================================
; GamePing.dll - configuration
;
; Полностью автономный плагин. Никаких списков игр здесь нет и не нужно.
; Плагин сам смотрит трафик того процесса, в который вы сейчас играете,
; находит сервер, к которому игра реально шлёт пакеты, проверяет его
; пингом и только после этого показывает значение.
;
; Если что-то пошло не так - сервер не нашёлся, не отвечает на ICMP,
; выдал 0 мс или нереально большое значение - плагин НЕ придумывает число,
; а показывает честный пинг до опорного хоста ([Settings] Addr).
;
; Личные правки лучше делать в файле GamePing.cfg.user - он перекрывает
; этот файл и не теряется при обновлении плагина.
;
; ВАЖНО: точное определение сервера использует raw-сокеты, а Windows даёт их
; только процессу с правами администратора. Значит MSI Afterburner должен
; запускаться от админа (см. README.md). Без админа плагин продолжает
; работать, но определение слабое (только по TCP), и чаще будет показываться
; опорный хост.
;=============================================================================

[Debug]
; 1 = писать лог в %LOCALAPPDATA%\GamePing\GamePing.log
; (видно, какую игру и какой сервер плагин определил и почему отклонил)
EnableLog = 1

[Auto]
; 1 = автоопределение сервера (основной и единственный режим работы)
; 0 = всегда пинговать только [Settings] Addr
Enabled = 1

; как часто заново проверять, куда шлёт трафик текущая игра, мс (мин. 2000)
RescanIntervalMs = 8000

; сколько слушать трафик за один проход, мс (мин. 300)
SampleWindowMs = 1500

; сколько пакетов должно уйти на один адрес, чтобы считать его сервером игры
; (отсекает фоновый шум: телеметрию, чат, обновления)
MinPackets = 6

; выше этого значения ответ считается недостоверным, мс
; (сервер за таким пингом либо не тот, либо ICMP через него не показателен)
MaxSaneMs = 900

; сколько подряд неудачных пингов терпеть, прежде чем бросить найденный
; сервер и вернуться к опорному хосту
MaxFailures = 3

[Settings]
; опорные хосты: то, что показывается, когда сервер игры не определён
; или определён недостоверно. Можно перечислить несколько через запятую -
; если текущий перестаёт отвечать на ICMP (rate-limit, VPN), плагин
; автоматически переходит к следующему.
; только яндексовые anycast-адреса Yandex.DNS: внутри РФ, ничего не блокируется,
; отвечают на ICMP без rate-limit и не требуют DNS-запроса вообще
Addr = 77.88.8.8, 77.88.8.1, 77.88.8.7

; период измерения, мс
Interval = 1000

; таймаут одного ICMP-запроса, мс
Timeout = 1000

; DNS-кеш больше не настраивается: адрес опорного хоста закрепляется
; и пере-разрешается только когда перестаёт отвечать (имена вроде yandex.ru
; каждый раз отдаёт другой anycast-адрес с другим rate-limit)

; что показывать в момент неудачного измерения
FailValue = 0

; 0 = игра остаётся целью, даже если вы свернулись в браузер
; 1 = учитывается только приложение в фокусе
ForegroundOnly = 0

; верхняя граница графика в Afterburner, мс
MaxLimit = 200

; имя и группа источника в списке мониторинга
Name = Ping
Group = PING
